name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "PyYAML>=6.0" "pytest>=8.0,<9"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Smoke-test chapter runners
        run: |
          python run_chapter.py chapter01
          python run_chapter.py chapter02
